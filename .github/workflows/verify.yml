name: Verify

on:
  push:
  # Expiry is a function of time: the build's identity check fails 30 days before the key, the
  # signed manifest or security.txt runs out, so build weekly even when nothing is pushed.
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Build + acceptance checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:bombadil
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bombadil-trace
          path: tmp/bombadil-*/trace.bin
          if-no-files-found: ignore
